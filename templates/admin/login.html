{% extends "base.html" %}
{% block title %}Admin Login — AI Kurd{% endblock %}

{% block content %}
<section class="relative overflow-hidden min-h-[70vh] flex items-center justify-center">
    <div class="absolute inset-0 grid-bg grid-fade pointer-events-none"></div>
    <div class="relative w-full max-w-sm mx-4">
        <div class="panel p-8">
            <p class="eyebrow mb-3">Admin access</p>
            <h1 class="display text-3xl mb-7">Sign in</h1>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for cat, msg in messages %}
                <p class="mb-4 text-sm border {{ 'border-white/40 text-white' if cat == 'error' else 'border-white/20 text-white/70' }} rounded-xl px-4 py-2.5">{{ msg }}</p>
                {% endfor %}
            {% endwith %}

            <form method="POST" class="space-y-4">
                <div>
                    <label class="block text-xs text-white/40 uppercase tracking-widest mb-2">Username</label>
                    <input name="username" required autocomplete="username"
                           class="w-full bg-black border border-white/15 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-white/50 transition-colors">
                </div>
                <div>
                    <label class="block text-xs text-white/40 uppercase tracking-widest mb-2">Password</label>
                    <input name="password" type="password" required autocomplete="current-password"
                           class="w-full bg-black border border-white/15 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-white/50 transition-colors">
                </div>
                <button class="btn btn-primary w-full">Sign in →</button>
            </form>
        </div>
    </div>
</section>
{% endblock %}
